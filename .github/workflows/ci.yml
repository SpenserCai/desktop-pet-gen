name: CI

# 自动执行 CONTRIBUTING.md 要求的全部检查（GUI 运行期冒烟除外，它需要图形会话，
# 由本地 `scripts/smoke_run.sh` 执行）。
#
# 约束：CI 不下载 ONNX 权重（合计约 658 MB），也不调用任何 AI 接口。
# 测试通过 tests/support/fakes.py 回放 tests/fixtures/ 里的录制素材达成等价覆盖。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Model registry sanity check (no download)
        run: python scripts/fetch_models.py --list

  rust:
    name: Rust runtime template (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: pet-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pet-runtime

      - name: Install Bevy system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev
          # tray 特性在 Linux 上经由 tray-icon → libappindicator 依赖 GTK3
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Format check (cargo fmt)
        run: cargo fmt --check

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (cargo test)
        run: cargo test

      - name: Optional tray feature compiles
        run: cargo check --features tray

      - name: Release build
        run: cargo build --release
