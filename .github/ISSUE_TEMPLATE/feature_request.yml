name: 功能请求 / Feature request
description: 提出一个新能力或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        如果你想加的是**新动作**、**新体型**、**新 Provider** 或**新运行时机制**，
        `docs/standards/EXTEND_ACTIONS.md` 与 `EXTEND_MECHANISMS.md` 里已经有明确的扩展步骤，
        大多数情况可以直接开 PR，不必先开 issue。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请描述使用场景，而不是直接给方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 如果你已有想法，请说明。包括对现有约束的影响（零文件写入、ASCII-only UI、跨语言契约等）。

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 以及为什么放弃它们。

  - type: checkboxes
    id: scope
    attributes:
      label: 影响面自评
      options:
        - label: 需要改动生成器 ↔ 运行时契约（`SPRITE_SHEETS` / `FRAME_SIZE` / `AnimState` 白名单）
        - label: 需要新增第三方依赖
        - label: 会改变现有 CLI 参数或配置项的语义
        - label: 我愿意提交 PR 实现它
