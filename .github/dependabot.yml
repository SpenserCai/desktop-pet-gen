version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: "/pet-runtime"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Bevy 大版本升级涉及大量 API 变更（见 docs/standards/RUNTIME_UX.md 的坐标系约定），
    # 只接受同一大版本内的更新，主版本升级手工做。
    ignore:
      - dependency-name: bevy
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
